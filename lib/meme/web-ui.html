<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表情包管理 · 群聊助手</title>
<style>
  :root {
    --bg: #17181c; --panel: #1e2027; --panel2: #24262e; --line: #33363f;
    --fg: #e6e7ea; --dim: #9aa0ac; --accent: #5b8cff; --danger: #e2565b; --ok: #43b581;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stat { color: var(--dim); font-size: 13px; }
  .grow { flex: 1; }
  button, .btn {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  input[type=text], input[type=password], select, textarea {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; font-family: inherit;
  }
  nav { display: flex; gap: 8px; padding: 12px 18px 0; }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 14px 18px 60px; }
  .cols { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .cat { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .cat:hover { background: var(--panel2); }
  .cat.active { background: var(--panel2); box-shadow: inset 2px 0 0 var(--accent); }
  .cat .k { font-weight: 600; }
  .cat .d { color: var(--dim); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .tile { position: relative; background: var(--panel2); border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .x {
    position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6);
    border: 0; color: #fff; border-radius: 6px; padding: 2px 6px; font-size: 12px; opacity: 0;
  }
  .tile:hover .x { opacity: 1; }
  .tile .n { position: absolute; bottom: 0; left: 0; right: 0; font-size: 11px; color: var(--dim);
    background: rgba(0,0,0,.55); padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .muted { color: var(--dim); font-size: 12px; }
  .pack { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .pack h3 { margin: 0 0 4px; font-size: 14px; }
  .tag { display: inline-block; background: var(--panel2); border-radius: 6px; padding: 1px 6px; font-size: 12px; color: var(--dim); margin-right: 4px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; display: none; max-width: 80vw; z-index: 20;
  }
  #toast.err { border-color: var(--danger); }
  #toast.ok { border-color: var(--ok); }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>表情包管理</h1>
  <span class="stat" id="stat">加载中…</span>
  <span class="grow"></span>
  <input type="password" id="token" placeholder="访问令牌" style="width:180px">
  <button id="save-token">保存令牌</button>
  <button id="refresh">刷新</button>
</header>

<nav>
  <button data-tab="gallery" class="active">图库</button>
  <button data-tab="store">资源广场</button>
</nav>

<main>
  <section id="view-gallery">
    <div class="cols">
      <div class="card">
        <div class="row">
          <strong>分类</strong><span class="muted" id="cat-count"></span>
          <span class="grow"></span>
          <button id="new-cat">+ 新建</button>
        </div>
        <div id="cats"></div>
      </div>
      <div class="card">
        <div class="row">
          <strong id="cur-cat">未选择分类</strong>
          <span class="muted" id="cur-desc"></span>
          <span class="grow"></span>
          <button id="pick">抽一张试试</button>
          <input type="file" id="file" accept="image/*" multiple hidden>
          <button class="primary" id="upload">上传图片</button>
        </div>
        <div class="grid" id="tiles"></div>
        <p class="hint">上传的图会存进所选分类；同名文件自动加序号，不会覆盖。</p>
      </div>
    </div>
  </section>

  <section id="view-store" hidden>
    <div class="card">
      <div class="row">
        <strong>安装表情包</strong>
        <input type="text" id="source" placeholder="包 id（如 official-001）或 owner/repo" style="flex:1;min-width:260px">
        <button class="primary" id="install">安装</button>
      </div>
      <p class="hint">支持：社区索引里的包 id、owner/repo、owner/repo#ref@subpath、GitHub 仓库/目录地址。
        表情包仓库动辄几十到几百 MB（官方1号 67MB、ATRI 304MB），点下去要等几分钟，中途别关页面。</p>
    </div>
    <div id="index" style="margin-top:14px"></div>
  </section>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
const state = { data: null, cat: '', index: [], token: localStorage.getItem('meme-token') || '' }

$('token').value = state.token

function toast(message, kind) {
  const el = $('toast')
  el.textContent = message
  el.className = kind || ''
  el.style.display = 'block'
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => { el.style.display = 'none' }, kind === 'err' ? 6000 : 2500)
}

function query(extra) {
  const params = new URLSearchParams(extra || {})
  params.set('token', state.token)
  return params.toString()
}

async function api(path, options) {
  const opts = options || {}
  const url = path.includes('?') ? path + '&' + query() : path + '?' + query()
  const res = await fetch(url, opts)
  const data = await res.json().catch(() => ({ ok: false, error: '响应不是 JSON' }))
  if (!data.ok) throw new Error(data.error || ('HTTP ' + res.status))
  return data
}

function imgUrl(pack, cat, name) {
  return '/img?' + query({ pack: pack, cat: cat, name: name })
}

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ))
}

async function loadState() {
  if (!state.token) { $('stat').textContent = '请先填访问令牌'; return }
  const data = await api('/api/state')
  state.data = data
  $('stat').textContent = `${data.packs.length} 个包 · ${data.categories.length} 个分类 · ${data.total} 张图 · rev ${data.revision}`
  const exists = data.categories.some((c) => c.key === state.cat)
  if (!exists) state.cat = data.categories[0] ? data.categories[0].key : ''
  renderCats()
  renderTiles()
}

function renderCats() {
  const cats = state.data ? state.data.categories : []
  $('cat-count').textContent = cats.length ? `（${cats.length}）` : '（空）'
  $('cats').innerHTML = cats.length
    ? cats.map((c) => `
      <div class="cat${c.key === state.cat ? ' active' : ''}" data-cat="${esc(c.key)}">
        <div class="k">${esc(c.key)} <span class="muted">${c.images.length} 张</span></div>
        <div class="d">${esc(c.desc || '（无描述，建议补一句用途，模型靠它选图）')}</div>
      </div>`).join('')
    : '<p class="muted">库是空的。去「资源广场」装一个包，或先新建分类再上传图片。</p>'
}

function renderTiles() {
  const cat = state.data && state.data.categories.find((c) => c.key === state.cat)
  $('cur-cat').textContent = cat ? cat.key : '未选择分类'
  $('cur-desc').textContent = cat ? (cat.desc || '') : ''
  $('tiles').innerHTML = cat
    ? cat.images.map((i) => `
      <div class="tile">
        <img loading="lazy" src="${esc(imgUrl(i.pack, i.cat, i.name))}" alt="${esc(i.name)}">
        <button class="x" data-del="${esc(i.pack)}|${esc(i.cat)}|${esc(i.name)}">删</button>
        <div class="n" title="${esc(i.pack)}">${esc(i.name)}</div>
      </div>`).join('')
    : '<p class="muted">先选一个分类。</p>'
}

async function loadIndex(refresh) {
  $('index').innerHTML = '<p class="muted">正在拉取社区索引…</p>'
  try {
    const data = await api('/api/index' + (refresh ? '?refresh=1' : ''))
    state.index = data.entries || []
    $('index').innerHTML = state.index.length
      ? state.index.map((p) => `
        <div class="pack">
          <h3>${esc(p.name)} <span class="tag">${esc(p.id)}</span></h3>
          <div class="muted">${esc(p.description || '')}</div>
          <div class="muted" style="margin-top:4px">
            ${(p.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
            维护者 ${esc(p.maintainer || '-')} · 许可 ${esc(p.license || '-')}
          </div>
          <div class="row" style="margin-top:8px">
            <button class="primary" data-install="${esc(p.id)}">安装 / 更新</button>
          </div>
        </div>`).join('')
      : `<p class="muted">${esc(data.error || '索引为空')}，可在上方手填 owner/repo 安装。</p>`
  } catch (error) {
    $('index').innerHTML = `<p class="muted">索引不可用：${esc(error.message)}</p>`
  }
}

// ── 事件 ──
$('save-token').onclick = () => {
  state.token = $('token').value.trim()
  localStorage.setItem('meme-token', state.token)
  loadState().catch((e) => toast(e.message, 'err'))
}

$('refresh').onclick = () => {
  loadState().then(() => toast('已刷新', 'ok')).catch((e) => toast(e.message, 'err'))
}

document.querySelectorAll('nav button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach((b) => b.classList.remove('active'))
    btn.classList.add('active')
    const tab = btn.dataset.tab
    $('view-gallery').hidden = tab !== 'gallery'
    $('view-store').hidden = tab !== 'store'
    if (tab === 'store' && !state.index.length) loadIndex(false)
  }
})

$('cats').onclick = (event) => {
  const node = event.target.closest('.cat')
  if (!node) return
  state.cat = node.dataset.cat
  renderCats()
  renderTiles()
}

$('tiles').onclick = async (event) => {
  const del = event.target.closest('[data-del]')
  if (!del) return
  const [pack, cat, name] = del.dataset.del.split('|')
  if (!confirm(`删除 ${name}？`)) return
  try {
    await api('/api/delete-image', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pack, cat, name }),
    })
    await loadState()
    toast('已删除', 'ok')
  } catch (error) { toast(error.message, 'err') }
}

$('new-cat').onclick = async () => {
  const name = prompt('新分类的键（建议英文小写，例如 happy）：')
  if (!name) return
  const desc = prompt('这个分类的用途（写给模型看，例如：庆祝、开心、成功确认）：', '')
  const pack = state.data && state.data.packs[0] ? state.data.packs[0].id : ''
  try {
    await api('/api/category', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'create', pack, cat: name.trim(), desc: desc || '' }),
    })
    state.cat = name.trim().toLowerCase()
    await loadState()
    toast('已新建分类', 'ok')
  } catch (error) { toast(error.message, 'err') }
}

$('upload').onclick = () => $('file').click()

$('file').onchange = async () => {
  if (!state.cat) { toast('先选一个分类', 'err'); return }
  const pack = state.data.packs[0] ? state.data.packs[0].id : ''
  const files = [...$('file').files]
  let done = 0
  for (const file of files) {
    try {
      await api('/api/upload?' + query({ pack, cat: state.cat, name: file.name }), {
        method: 'POST',
        headers: { 'content-type': 'application/octet-stream' },
        body: file,
      })
      done++
    } catch (error) { toast(`${file.name}：${error.message}`, 'err') }
  }
  $('file').value = ''
  await loadState()
  if (done) toast(`已上传 ${done} 张`, 'ok')
}

$('pick').onclick = async () => {
  if (!state.cat) { toast('先选一个分类', 'err'); return }
  try {
    const data = await api('/api/random', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ key: state.cat }),
    })
    toast(`随机命中 ${data.pick.name}（${Math.round(data.pick.bytes / 1024)}KB）—— 机器人回复时会发这类图`, 'ok')
  } catch (error) { toast(error.message, 'err') }
}

$('install').onclick = async () => {
  const source = $('source').value.trim()
  if (!source) return
  const btn = $('install')
  btn.disabled = true
  btn.textContent = '安装中…'
  try {
    const data = await api('/api/install', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ source }),
    })
    toast(`已安装 ${data.name}（${data.files} 个文件）`, 'ok')
    await loadState()
  } catch (error) { toast('安装失败：' + error.message, 'err') } finally {
    btn.disabled = false
    btn.textContent = '安装'
  }
}

$('index').onclick = (event) => {
  const btn = event.target.closest('[data-install]')
  if (!btn) return
  $('source').value = btn.dataset.install
  $('install').click()
}

if (state.token) {
  loadState().catch((e) => toast(e.message + '（核对访问令牌）', 'err'))
} else {
  $('stat').textContent = '请填写访问令牌（在插件启动日志或设置里可以看到）'
}
</script>
</body>
</html>
